name: CI
on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: action/dist is up to date
        run: |
          npm run build:action
          git diff --exit-code -- action/dist/index.js \
            || (echo "::error::action/dist/index.js is stale — run 'npm run build:action' and commit"; exit 1)
